name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: walksafe-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:43f20106cd2ac938475ba2631d22a7dc0b98a460438155109522f5928d6d10c4
        env:
          POSTGRES_DB: walksafe_test
          POSTGRES_USER: walksafe_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walksafe_test -d walksafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WALKSAFE_TEST_DATABASE_URL: postgresql+psycopg://walksafe_test:ci-only-password@127.0.0.1:5432/walksafe_test
      WALKSAFE_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/android-gateway/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Node regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          node_bin_dir="$(dirname "$(command -v node)")"
          echo "WALKSAFE_NODE_BIN_DIR=${node_bin_dir}" >> "${GITHUB_ENV}"
          npm --prefix apps/web ci
          npm --prefix apps/android-gateway ci
      - name: Verify closed Legacy Web and independent Android Gateway
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/web run lint
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
          npm --prefix apps/android-gateway run typecheck
          npm --prefix apps/android-gateway test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: tests/general-quality-cp312-linux-x86_64-cpu.lock
      - name: Install hash-locked general test environment
        run: |
          python -m pip install \
            --disable-pip-version-check --no-compile --upgrade "pip==26.1.1"
          python -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: --no-compile \
            -r tests/general-quality-cp312-linux-x86_64-cpu.lock
          python -m pip check
          python -I -B - <<'PY'
          import torch
          import torchvision

          assert torch.__version__ == "2.11.0+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert torchvision.__version__ == "0.26.0+cpu", torchvision.__version__
          PY
      - name: Verify canonical OpenAPI contract
        run: PYTHONPATH=. python scripts/generate_walksafe_openapi.py --check
      - run: PYTHON_BIN="$(command -v python)" scripts/run_walksafe_test_layers_20260711.sh all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: walksafe-quality-${{ github.sha }}
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/apk/
          if-no-files-found: error
