name: quality

on:
  pull_request:
    branches: [current]
  push:
    branches: [current]

permissions:
  contents: read

concurrency:
  group: walksafe-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:16-3.5@sha256:43f20106cd2ac938475ba2631d22a7dc0b98a460438155109522f5928d6d10c4
        env:
          POSTGRES_DB: walksafe_test
          POSTGRES_USER: walksafe_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walksafe_test -d walksafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WALKSAFE_TEST_DATABASE_URL: postgresql+psycopg://walksafe_test:ci-only-password@127.0.0.1:5432/walksafe_test
      WALKSAFE_SOURCE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: general_base_python
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: tests/general-quality-cp312-linux-x86_64-cpu.lock
      - name: Restore private evidence modes
        shell: bash
        env:
          GENERAL_BASE_PYTHON: ${{ steps.general_base_python.outputs.python-path }}
        run: |
          set -euo pipefail
          test -x "${GENERAL_BASE_PYTHON:?}"
          echo "WALKSAFE_GENERAL_BASE_PYTHON=${GENERAL_BASE_PYTHON}" >> "${GITHUB_ENV}"
          "${GENERAL_BASE_PYTHON}" -I -B scripts/restore_walksafe_private_evidence_modes.py
      - name: Verify current tree contains no new secrets
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP:?}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          binary="${RUNNER_TEMP:?}/gitleaks"
          report="${RUNNER_TEMP:?}/gitleaks-current.json"
          cleanup() {
            rm -f -- "${report}"
          }
          trap cleanup EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP:?}" gitleaks
          chmod 0755 "${binary}"
          scan_status=0
          "${binary}" dir \
            --no-banner --no-color \
            --report-format json --report-path "${report}" \
            --exit-code 1 . || scan_status=$?
          if [[ "${scan_status}" -ne 0 && "${scan_status}" -ne 1 ]]; then
            printf 'ERROR: Gitleaks execution failed with status %s\n' "${scan_status}" >&2
            exit "${scan_status}"
          fi
          "${WALKSAFE_GENERAL_BASE_PYTHON:?}" -I -B scripts/check_walksafe_gitleaks_report.py \
            --report "${report}" \
            --policy configs/walksafe_gitleaks_reviewed_findings.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/android-gateway/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Node regression dependencies
        shell: bash
        env:
          WALKSAFE_NODE_ARCHIVE_URL: https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz
          WALKSAFE_NODE_ARCHIVE_SHA256: 9749e988f437343b7fa832c69ded82a312e41a03116d766797ac14f6f9eee578
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP:?}/node-v22.23.1-linux-x64.tar.xz"
          node_root="${RUNNER_TEMP:?}/walksafe-node-v22.23.1-linux-x64"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "${WALKSAFE_NODE_ARCHIVE_URL:?}"
          printf '%s  %s\n' "${WALKSAFE_NODE_ARCHIVE_SHA256:?}" "${archive}" | \
            sha256sum --check --strict
          mkdir --mode=0755 "${node_root}"
          tar --extract --xz --same-permissions --file "${archive}" \
            --directory "${node_root}" --strip-components=1
          "${WALKSAFE_GENERAL_BASE_PYTHON:?}" -I -S -B scripts/check_walksafe_node_toolchain_20260715.py \
            --node-root "${node_root}" \
            --lock configs/walksafe_node_toolchain_lock_20260715.json
          node_bin_dir="${node_root}/bin"
          echo "WALKSAFE_NODE_BIN_DIR=${node_bin_dir}" >> "${GITHUB_ENV}"
          echo "${node_bin_dir}" >> "${GITHUB_PATH}"
          export PATH="${node_bin_dir}:/usr/bin:/bin"
          "${node_bin_dir}/npm" --prefix apps/web ci
          "${node_bin_dir}/npm" --prefix apps/android-gateway ci
      - name: Verify closed Legacy Web and independent Android Gateway
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/web run lint
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
          npm --prefix apps/android-gateway run typecheck
          npm --prefix apps/android-gateway test
      - name: Install hash-locked general test environment
        shell: bash
        run: |
          set -euo pipefail
          test "$("${WALKSAFE_GENERAL_BASE_PYTHON:?}" -I -S -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.12.13"
          general_environment="${RUNNER_TEMP:?}/walksafe-general-cp312"
          "${WALKSAFE_GENERAL_BASE_PYTHON:?}" -m venv "${general_environment}"
          general_python="${general_environment}/bin/python"
          test "$("${general_python}" -I -S -B -c 'import sys; print(sys.implementation.name, *sys.version_info[:3])')" = "cpython 3 12 13"
          test "$("${general_python}" -I -B -c 'from pathlib import Path; import sys; print(sys.prefix != sys.base_prefix and Path(sys.prefix, "pyvenv.cfg").is_file())')" = "True"
          "${general_python}" -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: --no-compile \
            -r tests/general-quality-cp312-linux-x86_64-cpu.lock
          "${general_python}" -m pip check
          "${general_python}" -I -B - <<'PY'
          import torch
          import torchvision

          assert torch.__version__ == "2.11.0+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert torchvision.__version__ == "0.26.0+cpu", torchvision.__version__
          PY
          echo "WALKSAFE_GENERAL_PYTHON_BIN=${general_python}" >> "${GITHUB_ENV}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: backup_python
        with:
          python-version: "3.14.6"
          update-environment: false
      - name: Install hash-locked backup integrity environment
        shell: bash
        env:
          BACKUP_BASE_PYTHON: ${{ steps.backup_python.outputs.python-path }}
        run: |
          set -euo pipefail
          test "$("${WALKSAFE_GENERAL_BASE_PYTHON:?}" -I -S -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.12.13"
          backup_environment="${RUNNER_TEMP:?}/walksafe-backup-cp314"
          "${BACKUP_BASE_PYTHON:?}" -m venv "${backup_environment}"
          backup_python="${backup_environment}/bin/python"
          test "$("${backup_python}" -I -S -B -c 'import sys; print(sys.implementation.name, *sys.version_info[:3])')" = "cpython 3 14 6"
          "${backup_python}" -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: --no-compile \
            -r tests/backup-integrity-cp314.lock
          "${backup_python}" -m pip check
          "${backup_python}" -I -S -B scripts/walksafe_backup_integrity.py \
            --runtime-capability-preflight
          echo "WALKSAFE_BACKUP_PYTHON_BIN=${backup_python}" >> "${GITHUB_ENV}"
          test "$("${WALKSAFE_GENERAL_BASE_PYTHON:?}" -I -S -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.12.13"
      - name: Verify canonical OpenAPI contract
        run: |
          PYTHONPATH=. "${WALKSAFE_GENERAL_PYTHON_BIN:?}" scripts/generate_walksafe_openapi.py --check
      - name: Verify current continuation boundary
        run: |
          "${WALKSAFE_GENERAL_PYTHON_BIN:?}" -B scripts/check_walksafe_project_continuation_v2_4.py
      - name: Run current checkpoint control tests
        run: |
          PYTHON_BIN="${WALKSAFE_GENERAL_PYTHON_BIN:?}" scripts/run_walksafe_test_layers_current.sh active-session-control
      - name: Verify repository catalogs
        run: |
          "${WALKSAFE_GENERAL_PYTHON_BIN:?}" -B scripts/generate_repository_catalogs.py --check
      - name: Verify current documentation contracts
        run: |
          "${WALKSAFE_GENERAL_PYTHON_BIN:?}" -B scripts/check_walksafe_active_docs.py --check
      - name: Verify test layer inventory
        run: |
          PYTHON_BIN="${WALKSAFE_GENERAL_PYTHON_BIN:?}" scripts/run_walksafe_test_layers_current.sh validate
      - name: Run model and data audit tests
        run: |
          PYTHON_BIN="${WALKSAFE_GENERAL_PYTHON_BIN:?}" scripts/run_walksafe_test_layers_current.sh model-audit
      - name: Run commit-stable test layers
        env:
          WALKSAFE_RUN_ANDROID_DEVICE_TESTS: "false"
          WALKSAFE_TFLITE_SMOKE_IMAGE: ""
        run: |
          general_python="${WALKSAFE_GENERAL_PYTHON_BIN:?}"
          test "$("${general_python}" -I -S -B -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.12.13"
          PYTHON_BIN="${general_python}" scripts/run_walksafe_test_layers_current.sh all
      - name: Verify Android quality artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/android/app/build/reports/lint-results-release.xml
          test -s apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s apps/android/adminapp/build/reports/lint-results-release.xml
          test -s apps/android/adminapp/build/outputs/apk/release/adminapp-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: walksafe-quality-${{ github.sha }}
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/outputs/apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: walksafe-admin-quality-${{ github.sha }}
          path: |
            apps/android/adminapp/build/reports/
            apps/android/adminapp/build/outputs/apk/
          if-no-files-found: error
