<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940"><rect width="960" height="940" fill="#e8ecf1" /><style>text{font-family:Arial,Apple SD Gothic Neo,sans-serif;fill:#102e50} .label{font-size:19px;font-weight:bold}</style><text x="480" y="36" text-anchor="middle" style="font-size:26px;fill:#102e50">수정된 코드 기준 화면 구조</text><text x="480" y="66" text-anchor="middle" style="font-size:17px;fill:#102e50">실기기 캡처 아님 · 문구와 거리는 예시</text><text x="250" y="108" text-anchor="middle" style="font-size:20px;fill:#102e50">안내 진행 중</text><rect x="40" y="130" width="420" height="730" rx="16" fill="#faf9f7" stroke="none" stroke-width="2" /><text x="250" y="174" text-anchor="middle" style="font-size:20px;fill:#102e50">목적지  구미역</text><rect x="56" y="195" width="388" height="316" rx="16" fill="#eef4fc" stroke="#b4c9e3" stroke-width="2" /><text x="250" y="246" text-anchor="middle" style="font-size:40px;fill:#102e50">↱</text><text x="250" y="289" text-anchor="middle" style="font-size:24px;fill:#102e50">50m 앞에서 오른쪽으로</text><text x="250" y="321" text-anchor="middle" style="font-size:24px;fill:#102e50">이동하세요.</text><text x="250" y="353" text-anchor="middle" style="font-size:21px;fill:#102e50" /><text x="250" y="385" text-anchor="middle" style="font-size:21px;fill:#102e50">남은 거리 350 m</text><text x="250" y="417" text-anchor="middle" style="font-size:21px;fill:#102e50">경로를 따라 안내 중입니다.</text><text x="250" y="471" text-anchor="middle" style="font-size:17px;fill:#102e50">다시 말해줘 · 보행 일시정지</text><text x="250" y="496" text-anchor="middle" style="font-size:17px;fill:#102e50">· 보행 종료</text><rect x="56" y="523" width="388" height="64" rx="16" fill="#1b4cd8" stroke="#1b4cd8" stroke-width="2" /><text x="250.0" y="563" text-anchor="middle" style="font-size:20px;fill:#ffffff">음성 명령</text><rect x="56" y="599" width="388" height="64" rx="16" fill="#ffffff" stroke="#1b4cd8" stroke-width="2" /><text x="250.0" y="639" text-anchor="middle" style="font-size:20px;fill:#1b4cd8">다시 듣기</text><rect x="56.0" y="675" width="388" height="64" rx="16" fill="#ffffff" stroke="#1b4cd8" stroke-width="2" /><text x="250.0" y="715" text-anchor="middle" style="font-size:20px;fill:#1b4cd8">일시정지</text><rect x="56" y="751" width="388" height="64" rx="16" fill="#ffffff" stroke="#1b4cd8" stroke-width="2" /><text x="250.0" y="791" text-anchor="middle" style="font-size:20px;fill:#1b4cd8">안내 종료</text><text x="710" y="108" text-anchor="middle" style="font-size:20px;fill:#102e50">유효한 장애물 경고가 있을 때</text><rect x="500" y="130" width="420" height="730" rx="16" fill="#faf9f7" stroke="none" stroke-width="2" /><text x="710" y="174" text-anchor="middle" style="font-size:20px;fill:#102e50">목적지  구미역</text><rect x="516" y="195" width="388" height="316" rx="16" fill="#ffeee9" stroke="#851b16" stroke-width="2" /><text x="710" y="246" text-anchor="middle" style="font-size:40px;fill:#851b16">!</text><text x="710" y="289" text-anchor="middle" style="font-size:24px;fill:#851b16">장애물 주의</text><text x="710" y="321" text-anchor="middle" style="font-size:24px;fill:#851b16" /><text x="710" y="353" text-anchor="middle" style="font-size:21px;fill:#851b16">전방에 장애물이 있습니다.</text><text x="710" y="385" text-anchor="middle" style="font-size:21px;fill:#851b16">잠시 멈춰 주세요.</text><rect x="516" y="523" width="388" height="64" rx="16" fill="#1b4cd8" stroke="#1b4cd8" stroke-width="2" /><text x="710.0" y="563" text-anchor="middle" style="font-size:20px;fill:#ffffff">음성 명령</text><rect x="516" y="599" width="388" height="64" rx="16" fill="#ffffff" stroke="#1b4cd8" stroke-width="2" /><text x="710.0" y="639" text-anchor="middle" style="font-size:20px;fill:#1b4cd8">다시 듣기</text><rect x="516.0" y="675" width="388" height="64" rx="16" fill="#ffffff" stroke="#1b4cd8" stroke-width="2" /><text x="710.0" y="715" text-anchor="middle" style="font-size:20px;fill:#1b4cd8">일시정지</text><rect x="516" y="751" width="388" height="64" rx="16" fill="#ffffff" stroke="#1b4cd8" stroke-width="2" /><text x="710.0" y="791" text-anchor="middle" style="font-size:20px;fill:#1b4cd8">안내 종료</text><text x="480" y="893" text-anchor="middle" style="font-size:18px;fill:#102e50">주요 버튼은 글자 크기와 관계없이 같은 순서의 세로 배치</text></svg>