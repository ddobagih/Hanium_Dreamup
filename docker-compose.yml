services:
  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    container_name: walksafe-postgis
    environment:
      POSTGRES_DB: walksafe
      POSTGRES_USER: walksafe
      POSTGRES_PASSWORD: walksafe
    ports:
      - "5432:5432"
    volumes:
      - walksafe-postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walksafe -d walksafe"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  walksafe-postgis-data:
